<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plaiiboy</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Controller Framework</p>
          <h1>plaiiboy</h1>
        </div>

        <div class="connection">
          <span class="connection-dot"></span>
          Interface aktiv
        </div>
      </header>

      <section class="dashboard">
        <article class="controller-preview">
          <div class="controller-stage">
            <div class="controller" id="controller-visual">
              <div class="shoulder shoulder-left">
                <div class="shoulder-button" data-control="L1">L1</div>
                <div class="trigger-button" data-control="L2">L2</div>
              </div>

              <div class="shoulder shoulder-right">
                <div class="shoulder-button" data-control="R1">R1</div>
                <div class="trigger-button" data-control="R2">R2</div>
              </div>

              <div class="controller-body">
                <div class="lightbar" id="controller-lightbar"></div>

                <button
                  class="small-button share-button"
                  type="button"
                  data-control="SHARE"
                >
                  SHARE
                </button>

                <button
                  class="small-button options-button"
                  type="button"
                  data-control="OPTIONS"
                >
                  OPTIONS
                </button>

                <button
                  class="touchpad"
                  type="button"
                  data-control="TOUCHPAD_CLICK"
                >
                  <span>TOUCHPAD</span>
                  <small id="touchpad-feedback">Swipe / Click</small>
                </button>

                <div class="dpad">
                  <button
                    class="dpad-button dpad-up"
                    type="button"
                    data-control="DPAD_UP"
                  >
                    ▲
                  </button>

                  <button
                    class="dpad-button dpad-left"
                    type="button"
                    data-control="DPAD_LEFT"
                  >
                    ◀
                  </button>

                  <div class="dpad-center"></div>

                  <button
                    class="dpad-button dpad-right"
                    type="button"
                    data-control="DPAD_RIGHT"
                  >
                    ▶
                  </button>

                  <button
                    class="dpad-button dpad-down"
                    type="button"
                    data-control="DPAD_DOWN"
                  >
                    ▼
                  </button>
                </div>

                <div class="face-buttons">
                  <button
                    class="face-button triangle"
                    type="button"
                    data-control="TRIANGLE"
                  >
                    △
                  </button>

                  <button
                    class="face-button square"
                    type="button"
                    data-control="SQUARE"
                  >
                    □
                  </button>

                  <button
                    class="face-button circle"
                    type="button"
                    data-control="CIRCLE"
                  >
                    ○
                  </button>

                  <button
                    class="face-button cross"
                    type="button"
                    data-control="CROSS"
                  >
                    ✕
                  </button>
                </div>

                <button
                  class="stick stick-left"
                  type="button"
                  data-control="L3"
                >
                  <span></span>
                </button>

                <button
                  class="stick stick-right"
                  type="button"
                  data-control="R3"
                >
                  <span></span>
                </button>

                <button class="ps-button" type="button" data-control="PS">
                  PS
                </button>
              </div>
            </div>

            <p class="controller-hint">
              Controller-Eingaben werden hier live angezeigt
            </p>
          </div>
        </article>

        <aside class="status-panel">
          <h2>Live Status</h2>

          <dl class="status-list">
            <div>
              <dt>Controller</dt>
              <dd id="controller-status">Nicht verbunden</dd>
            </div>

            <div>
              <dt>MIDI</dt>
              <dd id="midi-status">plaiiboy</dd>
            </div>

            <div>
              <dt>Layer</dt>
              <dd id="layer-status">default</dd>
            </div>

            <div>
              <dt>Aktives Deck</dt>
              <dd id="deck-status">1</dd>
            </div>

            <div>
              <dt>Seek-Modus</dt>
              <dd id="seek-status">1</dd>
            </div>
          </dl>
        </aside>
      </section>

      <section class="event-panel">
        <div>
          <span class="label">Letzte Eingabe</span>
          <strong id="last-input">–</strong>
        </div>

        <div>
          <span class="label">Letzte Aktion</span>
          <strong id="last-action">–</strong>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
